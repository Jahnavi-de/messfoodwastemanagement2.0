# Apache site for the cloud server. Assumes the project is in /opt/foodwaste.
#   sudo cp deploy/apache-foodwaste.conf /etc/apache2/sites-available/foodwaste.conf
#   sudo a2enmod proxy proxy_http rewrite
#   sudo a2dissite 000-default && sudo a2ensite foodwaste && sudo systemctl reload apache2
<VirtualHost *:80>
    # Your domain, or the server's public IP
    ServerName example.com

    # PHP backend:  http://SERVER/nextjsbackend/login.php, sensor_ingest.php, ...
    Alias /nextjsbackend /opt/foodwaste/nextjsbackend
    <Directory /opt/foodwaste/nextjsbackend>
        Require all granted
        AllowOverride All
    </Directory>

    # ML API (gunicorn on 127.0.0.1:5000) published as http://SERVER/ml-api/...
    ProxyPass        /ml-api/ http://127.0.0.1:5000/
    ProxyPassReverse /ml-api/ http://127.0.0.1:5000/

    # Optional: the Next.js frontend on the same server (npm run build && npm start -> port 3000).
    # Uncomment these three lines; they must stay below the two blocks above.
    # ProxyPass        /nextjsbackend !
    # ProxyPass        /  http://127.0.0.1:3000/
    # ProxyPassReverse /  http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/foodwaste-error.log
    CustomLog ${APACHE_LOG_DIR}/foodwaste-access.log combined
</VirtualHost>
